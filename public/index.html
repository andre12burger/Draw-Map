<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava Art Generator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet CSS e JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Plugin para Deslocamento de Linhas  -->
    <script src="https://unpkg.com/leaflet-polylineoffset/leaflet.polylineoffset.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>
    <!-- Painel de Legenda flutuante -->
    <div id="legenda">
        <!-- Barra de Pesquisa de Endereço -->
        <div style="margin-bottom: 15px; display: flex; gap: 5px; position: relative;">
            <div style="position: relative; flex: 1;">
                <input type="text" id="input-endereco" placeholder="Ex: Praça Saraiva, Rio Grande" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box;">
                
                <!-- Esta é a caixa que vai aparecer e desaparecer com as opções -->
                <div id="sugestoes-endereco" class="sugestoes-box"></div>
            </div>
            
            <button id="btn-buscar-endereco" style="padding: 8px 12px; background-color: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">🔍</button>
        </div>

        <strong>Modos de Traçado:</strong><br><br>
        🖱️ <b>Clique:</b> Segue as ruas<br>
        ⇧ <b>Shift + Clique:</b> Reta livre (Tracejada)<br>
        🖱️ <b>Botão Direito na linha:</b> Adiciona ponto de edição<br>
        ⎌ <b>Ctrl + Z:</b> Desfazer último trecho<br><br>
        
        <!-- Painel de Estatísticas -->
        <div style="margin-bottom: 15px; font-size: 15px; background: #f0f0f0; padding: 8px; border-radius: 4px; text-align: center; line-height: 1.5;">
            📏 <strong>Distância:</strong> <span id="distancia-total">0.00</span> km<br>
            📍 <strong>Pontos:</strong> <span id="contador-pontos">0</span><br>
            🌐 <strong>Requisições API:</strong> <span id="contador-api">0</span>
        </div>
        
        <button id="btn-exportar" style="width: 100%; padding: 8px; margin-bottom: 8px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-weight: bold;">📥 Baixar .GPX</button>
        <button id="btn-limpar" style="width: 100%; padding: 8px; cursor: pointer; background-color: #ff4c4c; color: white; border: none; border-radius: 4px; font-weight: bold;">🗑️ Apagar Tudo</button>
    </div>

    <div id="toolbar" class="toolbar">
        <button id="btn-ferramenta-rua" class="btn-ferramenta ativo" title="Modo Rua (Atalho: Tecla 1)">
            🛣️ Rua
        </button>
        <button id="btn-ferramenta-livre" class="btn-ferramenta" title="Modo Livre (Atalho: Tecla 2 ou Shift)">
            🦅 Livre
        </button>
        <button id="btn-ferramenta-lapis" class="btn-ferramenta" title="Modo Lápis Inteligente (Atalho: Tecla 3)">
            ✏️ Lápis
        </button>
    </div>

    <div id="map"></div>
    
    <!-- Scripts da Ferramenta -->
    <script type="module" src="js/persistence.js"></script>
    <script type="module" src="js/state.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/mapa.js"></script>
    <script type="module" src="js/previsao.js"></script>
    <script type="module" src="js/exportacao.js"></script>
    <script type="module" src="js/lapis.js"></script>
</body>
</html>
